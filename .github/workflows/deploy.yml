name: Deploy (Cloud Run)

# Deploys the API to Google Cloud Run from the source (Google builds the container with its Node.js buildpack, so the
# repository has no Dockerfile). Runs on a push to main, and by hand. Docs-only pushes are ignored.
#
# Sign-in to Google: Workload Identity Federation, so there is no key in GitHub. Set them up once: docs/deployment.md.
# Environment "production" (Settings → Environments; deployment branches: main only), all variables, no secret:
#   GCP_PROJECT_ID                       the Google Cloud / Firebase project id
#   GCP_REGION                           the Cloud Run region, europe-west1
#   GCP_WORKLOAD_IDENTITY_PROVIDER       projects/<number>/locations/global/workloadIdentityPools/github/providers/github-provider
#   GCP_SERVICE_ACCOUNT                  github-deployer@<project>.iam.gserviceaccount.com
#   CORS_ORIGIN                          the web origin allowed to call the API, https://damtchorzewski.github.io
#
# Free tier: no instance is kept warm (min 0), at most 2 run at once, a small memory size.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "**/.env.example"
      - ".scratch/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: personal-finance-manager-api
          region: ${{ vars.GCP_REGION }}
          source: .
          env_vars: |
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          flags: >-
            --allow-unauthenticated
            --service-account=pfm-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --min-instances=0
            --max-instances=2
            --memory=256Mi
            --cpu=1

      - name: Smoke check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$URL/health"
          echo
          echo "Deployed: $URL"
